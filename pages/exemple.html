    <svg id="js-plotly-tester" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
        style="position: absolute; left: -10000px; top: -10000px; width: 9000px; height: 9000px; z-index: 1;">
        <path class="js-reference-point" d="M0,0H1V1H0Z" style="stroke-width: 0; fill: black;"></path>
    </svg>
    <script>
        // Charge les scripts un par un, en attendant que chacun soit exécuté avant de charger le suivant
        function loadScriptsSequentially(urls, onDone) {
            let i = 0;
            function next() {
                if (i >= urls.length) {
                    if (onDone) onDone();
                    return;
                }
                const script = document.createElement('script');
                script.src = urls[i++];
                script.charset = 'utf-8';
                script.onload = next;
                document.body.appendChild(script);
            }
            next();
        }

        fetch("https://aemmeci.github.io/amc01.github.io/DATA/exemple.json")
        .then(response => response.json())
        .then(data => {
            const ropesData = data;

            // Fonction pour convertir une date DD/MM/YYYY en objet Date
            function parseDate(dateStr) {
                const [day, month, year] = dateStr.split('/').map(Number);
                return new Date(year, month - 1, day);
            }

            // Fonction pour formater un objet Date en DD/MM/YYYY
            function formatDate(date) {
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                return `${day}/${month}/${year}`;
            }

            // Fonction pour calculer la nouvelle date basée sur le delta
            function calculateNewDate(oldDateStr, baseDate, today) {
                const oldDate = parseDate(oldDateStr);
                const deltaDays = Math.floor((baseDate - oldDate) / (1000 * 60 * 60 * 24));
                const newDate = new Date(today.getTime() - (deltaDays * 1000 * 60 * 60 * 24));
                return formatDate(newDate);
            }

            // Dates de référence
            const BASE_DATE = parseDate("01/11/2025");
            const today = new Date();
            const dateString = today.toLocaleDateString('fr-FR'); // Format DD/MM/YYYY
            const TODAY = parseDate(dateString);

            function getRandomRecentTime() {
                const now = new Date();
                const randomDelay = Math.floor(Math.random() * 60 * 1000); // Retard aléatoire entre 0 et 60 secondes
                const pastTime = new Date(now.getTime() - (5 * 60 * 1000) - 3000 + randomDelay);

                const hours = String(pastTime.getHours()).padStart(2, '0');
                const minutes = String(pastTime.getMinutes()).padStart(2, '0');
                const seconds = String(pastTime.getSeconds()).padStart(2, '0');

                return `${hours}:${minutes}:${seconds}`;
            }

            // Générer une seule fois le day et hour pour toutes les ropes
            const currentDay = formatDate(TODAY);
            const currentHour = getRandomRecentTime();

            // Fonction pour mettre à jour l'historique d'une rope
            function updateHistorical(rope, sharedDay, sharedHour) {
                const oldHistorical = rope.historical;
                const newHistorical = {};

                for (const [oldDate, value] of Object.entries(oldHistorical)) {
                    const newDate = calculateNewDate(oldDate, BASE_DATE, TODAY);
                    newHistorical[newDate] = value;
                }

                rope.historical = newHistorical;

                // Mettre à jour aussi la date d'installation si elle existe
                if (rope.installation) {
                    rope.installation = calculateNewDate(rope.installation, BASE_DATE, TODAY);
                }

                // Mettre à jour last_acquisition avec la date et l'heure partagées
                if (rope.last_acquisition) {
                    rope.last_acquisition.day = sharedDay;
                    rope.last_acquisition.hour = sharedHour;
                }
            }

            // Appliquer la transformation aux deux ropes avec les mêmes day et hour
            if (ropesData.rope_1) {
                updateHistorical(ropesData.rope_1, currentDay, currentHour);
            }
            if (ropesData.rope_2) {
                updateHistorical(ropesData.rope_2, currentDay, currentHour);
            }

            // Rendre les données disponibles globalement pour les scripts externes
            window.jsonDatas = ropesData;

            // Refléter les données dans le DOM pour référence/debug
            document.getElementById("ropes-datas").textContent = JSON.stringify(ropesData, null, 4);

            // Les scripts suivants dépendent de window.jsonDatas : on ne les charge qu'une fois les données prêtes
            loadScriptsSequentially([
                "https://aemmeci.github.io/amc01.github.io/scripts/dashboard-gauge.js",
                "https://aemmeci.github.io/amc01.github.io/scripts/dashboard-lf-graph.js",
                "https://aemmeci.github.io/amc01.github.io/scripts/dashboard-histogram.js",
                "https://aemmeci.github.io/amc01.github.io/scripts/graphics.js"
            ]);
        })
        .catch(err => console.error("Failed to load rope data:", err));
    </script>
